<style>
:root {
  /* Strumento clinico da corsia: una domanda per schermata, pulsanti grandi, esito leggibile a colpo d'occhio. */
  --ink: #14213a;          /* testo */
  --muted: #5b6678;        /* testo secondario */
  --paper: #f4f6f9;        /* sfondo */
  --card: #ffffff;         /* superfici */
  --line: #d9dee7;         /* bordi */
  --accent: #1d4ed8;       /* azioni */
  --ok: #157a3c;  --ok-bg: #e2f3e8;
  --no: #b3261e;  --no-bg: #fbe7e5;
  --maybe: #8a5a00; --maybe-bg: #fdf0d0; --maybe-btn: #c98a00;
  --nope-btn: #4b5566;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e6ebf3; --muted: #9aa6b8; --paper: #0f1522; --card: #182133; --line: #2a3650; --accent: #6d9bff;
    --ok: #6fd28f; --ok-bg: #12301f; --no: #ff8a80; --no-bg: #3a1714; --maybe: #f5c35a; --maybe-bg: #33270b;
    --maybe-btn: #b57d00; --nope-btn: #5a6578; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e6ebf3; --muted: #9aa6b8; --paper: #0f1522; --card: #182133; --line: #2a3650; --accent: #6d9bff;
  --ok: #6fd28f; --ok-bg: #12301f; --no: #ff8a80; --no-bg: #3a1714; --maybe: #f5c35a; --maybe-bg: #33270b;
  --maybe-btn: #b57d00; --nope-btn: #5a6578; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font: 16px/1.45 var(--font-body);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 640px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
header h1 { font: 700 20px/1.1 var(--font-display); margin: 0; letter-spacing: .01em; }
header small { display: block; color: var(--muted); font: 500 12px/1.3 var(--font-body); margin-top: 3px; }
.anon { font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-bg); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
h2 { font: 700 17px/1.2 var(--font-display); margin: 4px 0 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* scelta studio */
.studio { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; text-align: left; width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-height: 64px; }
.studio b { font: 700 18px/1.15 var(--font-display); }
.studio span { color: var(--muted); font-size: 13px; grid-column: 1; }
.studio .freccia { grid-row: 1 / span 2; grid-column: 2; font-size: 22px; color: var(--accent); }
.studio:active { transform: scale(.99); }
.tutti { width: 100%; border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font: 700 17px/1.2 var(--font-display);
  padding: 16px; min-height: 56px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 12px; font-size: 14px; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* domanda */
.barra { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 4px; min-height: 40px; }
.link[disabled] { color: var(--muted); opacity: .5; cursor: default; }
.stati { display: flex; flex-wrap: wrap; gap: 6px; }
.stato { font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 4px 10px; }
.s-eleggibile { color: var(--ok); background: var(--ok-bg); }
.s-non_eleggibile { color: var(--no); background: var(--no-bg); }
.s-da_verificare { color: var(--maybe); background: var(--maybe-bg); }
.s-gia_inserito { color: var(--accent); background: var(--card); border: 1px solid var(--line); }
.avviso { border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 500; }
.avviso.no { background: var(--no-bg); color: var(--no); }
.avviso.warn { background: var(--maybe-bg); color: var(--maybe); }
.domanda { display: flex; flex-direction: column; gap: 16px; padding: 18px 16px; }
.domanda .testo { font: 700 22px/1.25 var(--font-display); text-wrap: balance; }
.domanda .aiuto { color: var(--muted); font-size: 15px; }
.risposte { display: grid; gap: 10px; }
.risposte.due { grid-template-columns: 1fr 1fr; }
.btn { border: 0; border-radius: 12px; min-height: 58px; padding: 12px; font: 700 19px/1.1 var(--font-display); color: #fff; }
.btn.si { background: var(--ok); }
.btn.no { background: var(--nope-btn); }
.btn.nonso { background: var(--card); color: var(--maybe); border: 2px solid var(--maybe-btn); font-size: 16px; min-height: 50px; }
.btn.opz { background: var(--accent); }
.btn.avanti { background: var(--accent); }
.btn:active { filter: brightness(.92); }
[data-theme="dark"] .btn.si, [data-theme="dark"] .btn.opz, [data-theme="dark"] .btn.avanti { color: #0f1522; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.si, :root:not([data-theme="light"]) .btn.opz,
  :root:not([data-theme="light"]) .btn.avanti, :root:not([data-theme="light"]) .tutti { color: #0f1522; } }
.campo { display: flex; align-items: center; gap: 10px; }
.campo input { flex: 1; min-width: 0; font: 600 24px/1.2 var(--font-body); padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--paper); color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; }
.campo .unita { color: var(--muted); font-size: 15px; min-width: 3em; }
.errore { color: var(--no); font-size: 14px; font-weight: 600; min-height: 1em; }
details.perche { font-size: 13.5px; color: var(--muted); }
details.perche summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 4px 0; }
details.perche p { margin-top: 6px; }

/* esito */
.verdetto { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; border-radius: var(--r); padding: 16px;
  border: 1px solid var(--line); background: var(--card); }
.verdetto .big { grid-row: 1 / span 2; font: 700 30px/1 var(--font-display); border-radius: 12px; padding: 12px 14px; text-align: center; min-width: 92px; }
.verdetto .nome { font: 700 18px/1.2 var(--font-display); }
.verdetto .sotto { font-size: 14px; color: var(--muted); }
.v-eleggibile .big { background: var(--ok-bg); color: var(--ok); }
.v-non_eleggibile .big { background: var(--no-bg); color: var(--no); }
.v-da_verificare .big { background: var(--maybe-bg); color: var(--maybe); }
.v-gia_inserito .big, .v-chiuso .big { background: var(--paper); color: var(--muted); }
.dettaglio { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; font-size: 14.5px; }
.esame { display: inline-block; background: var(--maybe-bg); color: var(--maybe); font-weight: 600; border-radius: 8px; padding: 3px 9px; margin: 2px 4px 2px 0; }
.motivo { border-left: 3px solid var(--no); padding-left: 10px; }
.nota { font-size: 13px; color: var(--muted); }
.azioni { display: grid; gap: 10px; }
.sec { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 16px; }
.riepilogo { font-size: 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.riepilogo div:nth-child(even) { font-weight: 600; text-align: right; }
footer { margin-top: auto; font-size: 12px; color: var(--muted); text-align: center; padding-top: 8px; }

/* elementi cliccabili nell'esito, menu, pazienti salvati */
.tocca { background: none; border: 0; padding: 0; color: inherit; text-align: left; font: inherit; text-decoration: underline;
  text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }
.tocca:hover { color: var(--accent); }
.esame { border: 0; font: inherit; font-weight: 600; cursor: pointer; }
.voce { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--line); padding: 9px 0; font: inherit; color: inherit; cursor: pointer; min-height: 44px; align-items: center; }
.voce b { text-align: right; }
.voce:last-child { border-bottom: 0; }
.menu { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; color: var(--accent);
  min-height: 36px; font-size: 14px; }
.salvati { display: flex; flex-direction: column; }
.salvato { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.salvato:last-child { border-bottom: 0; }
.salvato .apri { background: none; border: 0; text-align: left; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.salvato .apri b { font: 700 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.salvato .cancella { background: none; border: 0; color: var(--no); font-weight: 600; padding: 8px; min-height: 40px; }
.mini { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 6px; margin-right: 4px; }
.salva-box { display: flex; flex-direction: column; gap: 10px; }
.salva-box .riga { display: flex; gap: 10px; }
.salva-box input { flex: 1; min-width: 0; font: 600 22px/1.2 var(--font-body); padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--paper); color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
.salva-box button { border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; padding: 0 18px; min-height: 52px; }
.ok-msg { color: var(--ok); font-weight: 600; font-size: 14px; }
.codice { font-variant-numeric: tabular-nums; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.lista .tocca { display: block; text-align: left; margin: 6px 0 0; padding: 4px 0; }
.lista { margin-top: 8px; }
</style>

<script>
/* Motore delle regole della versione smartphone.
 * Copia fedele di motore.py e questionario.py dell'app per PC (stessa logica a tre valori, stesse derivazioni,
 * stessa scelta della prossima domanda). Unica differenza voluta: l'eta si ricava dall'ANNO di nascita;
 * se l'eta esatta decide l'esito (es. 64 o 65 anni per IRONCARD) si chiede se ha gia compiuto gli anni.
 * Il file e verificato automaticamente contro motore.py (test differenziale). Non contiene dati di pazienti.
 */
"use strict";
var MOTORE = (function () {
  var S = null;                // specifica: studi, campi, domande... (generata dal file dei criteri)
  var GIORNI_LONTANI = 99999;
  var ELEGG = "eleggibile", DAVER = "da_verificare", NONEL = "non_eleggibile", GIA = "gia_inserito";

  function imposta(spec) { S = spec; }

  // ---------------------------------------------------------------- utilita
  function vuoto(v) { return v === null || v === undefined || v === "" || v === "ignoto" || (Array.isArray(v) && v.length === 0); }
  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(String(v).replace(",", "."));
    return isFinite(n) ? n : null;
  }
  function data(v) {             // "AAAA-MM-GG" (o "AAAA-MM") -> giorni dall'epoca (UTC), null se non valida
    if (vuoto(v)) return null;
    var m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(String(v));
    if (!m) return null;
    var t = Date.UTC(+m[1], +m[2] - 1, m[3] ? +m[3] : 1);
    var d = new Date(t);
    if (d.getUTCMonth() !== +m[2] - 1) return null;
    return Math.floor(t / 86400000);
  }
  function unici(xs) { var o = []; xs.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
  function copia(o) { var c = {}; for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) c[k] = o[k]; return c; }
  function round1(x) { return Number(x.toFixed(1)); }   // come round(x, 1) di Python (valore decimale esatto)

  function ckdEpi2021(creat, eta, sesso) {
    if (creat === null || eta === null || eta === undefined || (sesso !== "M" && sesso !== "F")) return null;
    var k = sesso === "F" ? 0.7 : 0.9, a = sesso === "F" ? -0.241 : -0.302, r = creat / k;
    var v = 142 * Math.pow(Math.min(r, 1), a) * Math.pow(Math.max(r, 1), -1.2) * Math.pow(0.9938, eta);
    if (sesso === "F") v *= 1.012;
    return round1(v);
  }

  // ---------------------------------------------------------------- valori calcolati
  function valoriEffettivi(dati, interventistici) {
    var v = {}, k;
    for (k in dati) v[k] = vuoto(dati[k]) ? null : dati[k];
    function metti(nome, valore, forza) {
      if (valore === null || valore === undefined) return;
      if (forza || v[nome] === null || v[nome] === undefined) v[nome] = valore;
    }
    var dVal = data(v.data_valutazione);
    function giorniDa(campo) { var d = data(v[campo]); return d === null ? null : dVal - d; }

    // Eta: dall'anno di nascita (smartphone) o scritta direttamente
    if (num(v.anno_nascita) !== null) {
      var annoVal = new Date(dVal * 86400000).getUTCFullYear();
      var hi = annoVal - num(v.anno_nascita);
      if (v.compleanno_fatto === "si") v.eta_anni = hi;
      else if (v.compleanno_fatto === "no") v.eta_anni = hi - 1;
      else { v.eta_anni = null; v.__eta_range = [hi - 1, hi]; }
    } else if (num(v.eta_anni) !== null) {
      v.eta_anni = Math.trunc(num(v.eta_anni));
    }

    var p = num(v.peso_kg), h = num(v.altezza_cm);
    if (p && h) metti("bmi", round1(p / Math.pow(h / 100, 2)), true);

    if (num(v.egfr) === null) {
      var etaPerEgfr = v.eta_anni !== null && v.eta_anni !== undefined ? v.eta_anni : (v.__eta_range ? v.__eta_range[1] : null);
      metti("egfr", ckdEpi2021(num(v.creatinina), etaPerEgfr, v.sesso), false);
    }
    var eg = num(v.egfr);
    if ((v.ckd === null || v.ckd === undefined) && eg !== null && eg < 60) metti("ckd", "si");

    var g = giorniDa("data_prima_diagnosi_sc");
    if (g !== null) metti("mesi_da_diagnosi_sc", Math.floor(g / 30.4375), true);
    g = giorniDa("data_dimissione_ultimo_ricovero_sc");
    if (g !== null) metti("giorni_da_dimissione_sc", g, true);
    else if (v.ricovero_sc_12m === "no") metti("giorni_da_dimissione_sc", GIORNI_LONTANI);
    g = giorniDa("data_ultimo_infarto");
    if (g !== null) metti("infarto_recente_giorni", g, true);
    else if (v.infarto_pregresso === "no") metti("infarto_recente_giorni", GIORNI_LONTANI);
    g = giorniDa("data_diagnosi_t2d");
    if (g !== null) metti("giorni_da_diagnosi_t2d", g, true);

    if (v.ritmo_ecg === "fibrillazione_atriale" || v.ritmo_ecg === "flutter_atriale") metti("fa_flutter_in_atto", "si", true);
    else if (v.ritmo_ecg === "sinusale") metti("fa_flutter_in_atto", "no", true);

    if (v.abitudine_fumo) metti("fumo_attuale", v.abitudine_fumo === "attuale" ? "si" : "no", true);

    var comp = [v.cardiopatia_ischemica, v.ictus_tia, v.arteriopatia_periferica];
    if (comp.indexOf("si") >= 0 || v.infarto_pregresso === "si") metti("malattia_cv_accertata", "si", true);
    else if (comp.every(function (x) { return x === "no"; })) metti("malattia_cv_accertata", "no", true);

    var fattori = [v.ipertensione, v.dislipidemia, v.ckd, v.fumo_attuale];
    var si = fattori.filter(function (x) { return x === "si"; }).length;
    var ign = fattori.filter(function (x) { return x !== "si" && x !== "no"; }).length;
    if (ign === 0 || si >= 2 || si + ign < 2) metti("n_fattori_rischio_cardiometabolico", si, true);

    var diur = [v.diuretico_ansa, v.tiazidico, v.diuretico_ansa_orale_regolare];
    if (diur.indexOf("si") >= 0) metti("diuretico_in_terapia", "si", true);
    else if (v.diuretico_ansa === "no" && v.tiazidico === "no") metti("diuretico_in_terapia", "no", true);
    if (v.diuretico_ansa === "no") metti("diuretico_ansa_orale_regolare", "no");
    var farm = ["beta_bloccante", "acei", "arb", "arni", "mra", "sglt2i"].map(function (x) { return v[x]; }).concat([v.diuretico_in_terapia]);
    if (farm.indexOf("si") >= 0) metti("farmaco_sc_in_terapia", "si", true);
    else if (farm.every(function (x) { return x === "no"; })) metti("farmaco_sc_in_terapia", "no", true);

    if (v.sesso === "M") { metti("gravidanza_allattamento", "no", true); metti("potenziale_fertile", "no", true); }
    if (v.diabete === "no") {
      metti("insulina_multiiniettiva_o_microinfusore", "no", true);
      metti("retinopatia_trattata_o_da_trattare_180gg", "no", true);
    }
    var inCorso = v.studi_in_corso || [];
    v.studi_in_corso = inCorso;
    if (inCorso.some(function (c) { return interventistici.indexOf(c) >= 0; })) {
      metti("trial_interventistico_consenso_firmato", "si");
      metti("trial_clinico_in_corso_o_previsto", "si");
    }
    if (inCorso.indexOf("HF-POLARIS") >= 0) metti("gia_randomizzato_polaris", "si");
    return v;
  }

  // ---------------------------------------------------------------- regole
  function uguale(a, b) {
    if (typeof b === "number") { var na = num(a); return na !== null && na === b; }
    return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }
  function foglia(op, x, rif, dValutazione) {
    if (op === "=") return uguale(x, rif);
    if (op === "!=") return !uguale(x, rif);
    if (op === "in" || op === "non_in") {
      var lista = Array.isArray(rif) ? rif : [rif];
      var dentro = lista.some(function (r) { return uguale(x, r); });
      return op === "in" ? dentro : !dentro;
    }
    if (op === "entro_giorni") { var d = data(x); if (d === null) return null; return dValutazione - d <= Number(rif); }
    var a = num(x), b = num(rif);
    if (a === null || b === null) return null;
    if (op === ">") return a > b;
    if (op === ">=") return a >= b;
    if (op === "<") return a < b;
    if (op === "<=") return a <= b;
    throw new Error("Operatore non riconosciuto: " + op);
  }
  function valuta(regola, val) {   // -> [esito true/false/null, mancanti]
    var figli, manc;
    if (regola.tutti) {
      figli = regola.tutti.map(function (r) { return valuta(r, val); });
      if (figli.some(function (f) { return f[0] === false; })) return [false, []];
      manc = [];
      figli.forEach(function (f) { if (f[0] === null) manc = manc.concat(f[1]); });
      return figli.some(function (f) { return f[0] === null; }) ? [null, unici(manc)] : [true, []];
    }
    if (regola.almeno_uno) {
      figli = regola.almeno_uno.map(function (r) { return valuta(r, val); });
      if (figli.some(function (f) { return f[0] === true; })) return [true, []];
      manc = [];

MOTORE.imposta(SPEC);
var K = MOTORE.costanti;
var CHIAVE_ARCHIVIO = "screening_studi_pazienti_v1";

// Stato del paziente in corso (in memoria). Si salva sul telefono solo se il medico tocca "Salva".
var st = statoVuoto();
function statoVuoto() {
  return { vista: "inizio", studi: [], dati: nuoviDati(), saltate: [], storia: [], avviso: "", conferma: null,
           coda: [], codice: "", msg: "" };
}
function oggiIso() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function nuoviDati() { return { data_valutazione: oggiIso(), studi_in_corso: [] }; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function el(id) { return document.getElementById(id); }
function aperti() { return SPEC.studi.map(function (s) { return s.codice; }); }
function tipoBreve(t) { return (t || "").indexOf("interventistico") === 0 ? "sperimentazione con farmaco" : "registro osservazionale"; }
function etichettaOpz(v, o) { var m = SPEC.opzioni_etichette[v] || {}; return m[o] || String(o).replace(/_/g, " "); }
function etichettaVar(v) {
  if (v.indexOf("vm__") === 0) { var c = criterioVm(v); return c ? c.domanda || c.testo : v; }
  var d = SPEC.domande[v]; return d ? d[0] : ((SPEC.campi[v] || {}).etichetta || v);
}
function criterioVm(k) {
  var p = k.split("__"), s = SPEC.studi.filter(function (x) { return x.codice === p[1]; })[0];
  return s ? s.criteri.filter(function (c) { return c.id === p[2]; })[0] : null;
}
function interventistici() {
  return SPEC.tutti_gli_studi.filter(function (x) { return x.tipo.indexOf("interventistico") === 0; }).map(function (x) { return x.codice; });
}
function risultati() {
  return MOTORE.analizza(st.dati).filter(function (r) { return st.studi.indexOf(r.codice) >= 0; })
    .sort(function (a, b) { return st.studi.indexOf(a.codice) - st.studi.indexOf(b.codice); });
}
var VERDETTO = { eleggibile: "SÌ", non_eleggibile: "NO", da_verificare: "FORSE", gia_inserito: "già in studio" };

// ------------------------------------------------------------------ archivio sul telefono
function archivio() {
  try { return JSON.parse(localStorage.getItem(CHIAVE_ARCHIVIO) || "{}") || {}; } catch (e) { return null; }
}
function scriviArchivio(a) {
  try { localStorage.setItem(CHIAVE_ARCHIVIO, JSON.stringify(a)); return true; } catch (e) { return false; }
}
function prossimoCodice() {
  var a = archivio() || {}, n = 0;
  Object.keys(a).forEach(function (k) { var x = parseInt(k, 10); if (!isNaN(x) && x > n) n = x; });
  return String(n + 1).padStart(4, "0");
}
function salvaPaziente(codice) {
  var a = archivio();
  if (a === null) return "Il salvataggio non è disponibile in questo browser (navigazione privata?).";
  var ris = MOTORE.analizza(st.dati);
  a[codice] = { dati: st.dati, saltate: st.saltate, storia: st.storia, studi: st.studi, salvato: new Date().toISOString(),
                esiti: ris.filter(function (r) { return st.studi.indexOf(r.codice) >= 0; }).map(function (r) { return [r.codice, r.esito]; }) };
  if (!scriviArchivio(a)) return "Non è stato possibile salvare (memoria del browser piena o bloccata).";
  st.codice = codice;
  return "";
}
function apriPaziente(codice) {
  var a = archivio() || {}, p = a[codice];
  if (!p) return;
  st = statoVuoto();
  st.dati = p.dati; st.saltate = p.saltate || []; st.storia = p.storia || []; st.studi = p.studi || aperti();
  st.codice = codice; st.dati.data_valutazione = oggiIso();
  st.vista = "esito"; render();
}
function cancellaPaziente(codice) {
  var a = archivio() || {};
  delete a[codice]; scriviArchivio(a);
  if (st.codice === codice) st.codice = "";
}

// ------------------------------------------------------------------ parti comuni
function testata(conMenu) {
  var badge = '<span class="anon" title="Nessun nome, nessuna data di nascita. Si salva solo su questo telefono, se lo chiedi.">Senza nomi</span>';
  var menu = conMenu ? '<button class="menu" id="menu">Menu</button>' : badge;
  return '<header><div><h1>Screening studi</h1><small>Cardiologia · criteri v' + esc(SPEC.versione_criteri) +
         (st.codice ? ' · paziente <span class="codice">' + esc(st.codice) + '</span>' : '') + '</small></div>' + menu + '</header>';
}
var piede = function () {
  return '<footer>L’app suggerisce, non decide: l’eleggibilità definitiva è dello sperimentatore e serve il consenso firmato.' +
         ' Regole del ' + esc(SPEC.generato.split("-").reverse().join("/")) + '. I pazienti salvati restano solo su questo telefono.</footer>';
};
function collegaMenu() { if (el("menu")) el("menu").onclick = function () { st.vista = "inizio"; st.coda = []; render(); }; }

// ------------------------------------------------------------------ vista: menu principale
function vistaInizio() {
  var h = testata(false);

  var inCorso = Object.keys(st.dati).length > 2 || st.storia.length;
  if (inCorso) {
    h += '<div class="card stack"><p><b>Paziente in corso' + (st.codice ? ' <span class="codice">' + esc(st.codice) + '</span>' : '') +

  }
  h += '<div class="stack"><h2>Per quale studio vuoi verificare il paziente?</h2>' +

       (inCorso ? ' Le risposte già date restano: per un altro studio chiede solo quello che manca.' : '') + '</p></div>';
  h += '<div class="stack">';

    h += '<button class="studio" data-studio="' + esc(s.codice) + '"><b>' + esc(s.codice) + '</b>' +

  h += '<div class="card stack"><p><b>Il paziente è già in uno di questi studi?</b></p><p class="muted">Serve per le regole di co-arruolamento. Lascia tutto spento se non partecipa a nessuno.</p><div class="chips">';
  SPEC.studi_in_corso_selezionabili.forEach(function (c) {
    var on = st.dati.studi_in_corso.indexOf(c) >= 0;

  });
  h += '</div></div>';
  // pazienti salvati
  var a = archivio();
  var codici = a ? Object.keys(a).sort() : [];
  h += '<div class="card stack"><p><b>Pazienti salvati su questo telefono (' + codici.length + ')</b></p>';
  if (a === null) h += '<p class="muted">Il salvataggio non è disponibile in questo browser.</p>';
  else if (!codici.length) h += '<p class="muted">Nessuno. Alla fine delle domande puoi salvare il paziente con un codice numerico.</p>';
  else {
    h += '<div class="salvati">';

      var p = a[k], d = new Date(p.salvato);

      }).join("");

           d.toLocaleDateString("it-IT") + '</span><br>' + es + '</button>' +
           '<button class="cancella" data-cancella="' + esc(k) + '" aria-label="Cancella paziente ' + esc(k) + '">Cancella</button></div>';
    });
    h += '</div>';
  }
  h += '</div>';
  if (inCorso) h += '<button class="sec" id="nuovo">Nuovo paziente (svuota le risposte)</button>';
  h += piede();
  el("app").innerHTML = h;
  document.querySelectorAll("[data-studio]").forEach(function (b) { b.onclick = function () { avvia([b.getAttribute("data-studio")]); }; });

  if (el("riprendi")) el("riprendi").onclick = function () { st.vista = "esito"; render(); };

    b.onclick = function () {
      var c = b.getAttribute("data-gia"), l = st.dati.studi_in_corso, i = l.indexOf(c);

}

function avvia(studi) {
  st.studi = studi; st.avviso = ""; st.coda = [];
  var gia = risultati().filter(function (r) { return r.esito === K.NONEL; });
  if (gia.length) st.avviso = testoEsclusi(gia, "già escluso dalle risposte date");
  prossima();
}

// prossima domanda: prima quelle chieste dal medico (correzioni), poi quelle del questionario
function prossima() {
  var ris = risultati();
  while (st.coda.length) {
    var v = st.coda.shift();
    if (!visibile(v)) continue;
    st.dom = MOTORE.domandaPer(v, ris); st.dom.correzione = true;
    st.ris = ris; st.vista = "domanda"; st.conferma = null; render(); return;
  }
  var d = MOTORE.prossima(st.dati, st.studi, st.saltate, ris);
  if (!d) { st.vista = "esito"; render(); return; }
  st.dom = d; st.ris = ris; st.vista = "domanda"; st.conferma = null; render();
}
function visibile(v) {
  var c = SPEC.campi[v];
  if (!c || !c.mostra_se) return true;
  return Object.keys(c.mostra_se).every(function (k) { return c.mostra_se[k].indexOf(st.dati[k]) >= 0; });
}

// variabili da chiedere per correggere un dato mostrato nell'esito
var CORREGGI = { eta_anni: ["anno_nascita"], bmi: ["peso_kg", "altezza_cm"], fa_flutter_in_atto: ["ritmo_ecg"] };
function daCorreggere(v) {
  if (CORREGGI[v]) return CORREGGI[v];
  var c = SPEC.campi[v];
  if (v.indexOf("vm__") === 0 || (c && c.tipo !== "calc")) return [v];
  return MOTORE.fontiDi(v).filter(function (x) { return x !== v; });
}
function correggi(v) {
  var lista = daCorreggere(v);
  st.saltate = st.saltate.filter(function (x) { return lista.indexOf(x) < 0; });
  st.coda = lista.slice();
  st.avviso = "";
  prossima();
}

// ------------------------------------------------------------------ vista: domanda

  h += '<div class="stati">' + st.ris.map(function (r) {
    var t = { eleggibile: "sì", non_eleggibile: "no", da_verificare: "in corso", gia_inserito: "già in studio" }[r.esito];

  if (d.aiuto) h += '<p class="aiuto">' + esc(d.aiuto) + '</p>';

  } else if (d.tipo === "scelta") {

            "Criterio " + d.criterio.id + " (" + d.criterio.lista + "): " + d.criterio.testo;

  collegaMenu();
  document.querySelectorAll("[data-r]").forEach(function (b) {
    b.onclick = function () { var r = b.getAttribute("data-r"); rispondi(r === "__nonso" ? null : r); };
  });
  el("indietro").onclick = indietro;
  el("fine").onclick = function () { st.coda = []; st.vista = "esito"; render(); };
  var f = el("f");
  if (f) {
    f.onsubmit = function (e) { e.preventDefault(); daCampo(); };
    setTimeout(function () { try { el("valore").focus(); } catch (e) {} }, 30);
  }
}

function daCampo() {
  var d = st.dom, testo = el("valore").value.trim(), err = el("errore");
  if (!testo) { err.textContent = "Scrivi un valore, oppure tocca “Non so”."; return; }
  var v;
  if (d.tipo === "data") {
    v = testo.length === 7 ? testo + "-01" : testo;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { err.textContent = "Data non valida."; return; }
    if (v > oggiIso()) { err.textContent = "La data è nel futuro."; return; }
  } else {
    var n = MOTORE.num(testo);
    if (n === null) { err.textContent = "Scrivi un numero (es. 35 o 1,4)."; return; }
    if (d.tipo === "int") n = Math.round(n);
    var mn = d.min, mx = d.max;
    if (((mn !== null && mn !== undefined && n < mn) || (mx !== null && mx !== undefined && n > mx)) && st.conferma !== testo) {
      st.conferma = testo;
      err.textContent = "Valore insolito (atteso " + mn + "–" + mx + "). Tocca Avanti di nuovo per confermarlo.";
      return;
    }
    v = n;
  }
  rispondi(v);
}

function rispondi(valore) {
  var d = st.dom, prima = {};
  st.ris.forEach(function (r) { prima[r.codice] = r.esito; });
  st.storia = st.storia.filter(function (x) { return x[0] !== d.var; });   // una sola voce per domanda nel riepilogo
  st.storia.push([d.var, st.dati[d.var], st.saltate.indexOf(d.var) >= 0]);
  if (valore === null) { delete st.dati[d.var]; if (st.saltate.indexOf(d.var) < 0) st.saltate.push(d.var); }
  else { st.saltate = st.saltate.filter(function (x) { return x !== d.var; }); st.dati[d.var] = valore; }
  var ris = risultati();
  var nuovi = ris.filter(function (r) { return r.esito === K.NONEL && prima[r.codice] !== K.NONEL; });
  st.avviso = testoEsclusi(nuovi, "escluso");
  if (d.var === "setting" && valore) {
    ris.forEach(function (r) {
      var amm = r.arruolamento.setting_ammessi || [];
      if (amm.length && amm.indexOf(valore) < 0) {
        var a = r.avvisi[0] || ("setting non previsto (ammessi: " + amm.join(", ") + ")");
        st.avviso = "⚠ " + r.codice + ": " + a + (st.avviso ? "\n" + st.avviso : "");
      }
    });
  }
  prossima();
}

function indietro() {
  var x = st.storia.pop();
  if (!x) return;
  if (x[1] === undefined || x[1] === null) delete st.dati[x[0]]; else st.dati[x[0]] = x[1];
  st.saltate = st.saltate.filter(function (v) { return v !== x[0]; });
  if (x[2]) st.saltate.push(x[0]);
  st.avviso = ""; st.coda = [];
  prossima();
}

function testoEsclusi(lista, parola) {
  return lista.map(function (r) {
    var m = r.esclude.map(function (c) { return c.id + " — " + c.testo.slice(0, 120); }).join("; ");
    if (r.conflitti.length) m += (m ? ". " : "") + "co-arruolamento con " + r.conflitti.join(", ");
    return "✗ " + r.codice + " " + parola + ": " + m;
  }).join("\n");
}

// ------------------------------------------------------------------ vista: esito
function variabiliRegola(r, acc) {
  if (!r) return acc;
  if (r["var"] && acc.indexOf(r["var"]) < 0) acc.push(r["var"]);
  (r.tutti || []).concat(r.almeno_uno || []).forEach(function (x) { variabiliRegola(x, acc); });
  return acc;
}
function valoreLeggibile(v, x) {
  var c = SPEC.campi[v] || {};
  if (x === "si") return "sì";
  if (x === "no") return "no";
  if (x === 99999) return "nessun evento";
  if (c.tipo === "scelta") return etichettaOpz(v, x);
  if (c.tipo === "data") return String(x).split("-").reverse().join("/");
  return String(x).replace(".", ",") + (c.unita ? " " + c.unita : "");
}
var NOMI_CALCOLATI = { eta_anni: "Età", bmi: "BMI", egfr: "eGFR", mesi_da_diagnosi_sc: "Mesi dalla diagnosi di scompenso",
  giorni_da_dimissione_sc: "Giorni dalla dimissione", infarto_recente_giorni: "Giorni dall'ultimo infarto",
  giorni_da_diagnosi_t2d: "Giorni dalla diagnosi di diabete", n_fattori_rischio_cardiometabolico: "Fattori di rischio presenti",
  malattia_cv_accertata: "Malattia CV accertata", fa_flutter_in_atto: "FA/flutter all'ECG", diuretico_in_terapia: "Diuretico in terapia",
  farmaco_sc_in_terapia: "Farmaco per lo scompenso", fumo_attuale: "Fumatore attuale" };
function datiCheEscludono(codice, c, val) {   // [[variabile, testo], ...]
  var s = SPEC.studi.filter(function (x) { return x.codice === codice; })[0];
  var orig = s.criteri.filter(function (x) { return x.id === c.id && x.lista === c.lista; })[0] || {};
  if (orig.manuale) return [[MOTORE.chiaveVm(codice, c.id), "Risposta: " + valoreLeggibile("", val[MOTORE.chiaveVm(codice, c.id)]) + " — " + (orig.domanda || "")]];
  var vars = variabiliRegola(orig.regola, []).concat(variabiliRegola(orig.solo_se, []));
  return vars.filter(function (v) { return !MOTORE.vuoto(val[v]); }).map(function (v) {
    var et = NOMI_CALCOLATI[v] || ((SPEC.campi[v] || {}).etichetta || v);
    return [v, et + ": " + valoreLeggibile(v, val[v])];
  });
}

function vistaEsito() {
  var ris = risultati(), h = testata(true);
  var val = MOTORE.valoriEffettivi(st.dati, interventistici());
  if (st.msg) { h += '<p class="ok-msg" role="status">' + esc(st.msg) + '</p>'; st.msg = ""; }
  h += '<h2>Esito</h2><p class="muted">Tocca un dato sottolineato per correggerlo: le altre risposte restano.</p><div class="stack">';
  ris.forEach(function (r) {
    var chiave = r.esito, big, sotto;
    if (r.esito === K.ELEGG) { big = "SÌ"; sotto = "Eleggibile: tutti i criteri sono soddisfatti."; }
    else if (r.esito === K.NONEL) { big = "NO"; sotto = "Non eleggibile."; }
    else if (r.esito === K.DAVER) { big = "FORSE"; sotto = "Nessun criterio lo esclude, ma mancano dati."; }
    else { big = "—"; sotto = "Il paziente è già in questo studio."; }
    if (!r.arruolabile_ora && r.esito !== K.GIA) { chiave = "chiuso"; sotto = "Non arruolabile ora: " + r.motivo_non_arruolabile + "."; }
    h += '<article class="verdetto v-' + chiave + '"><div class="big">' + big + '</div><div class="nome">' + esc(r.codice) + '</div>' +
         '<div class="sotto">' + esc(sotto) + '</div><div class="dettaglio">';
    if (r.esito === K.NONEL) {
      r.esclude.forEach(function (c) {
        var dati = datiCheEscludono(r.codice, c, val);
        h += '<div class="motivo"><b>' + esc(c.id) + '</b> ' + (dati.length ? dati.map(function (x) {
               return '<button class="tocca" data-correggi="' + esc(x[0]) + '">' + esc(x[1]) + '</button>'; }).join(" · ") : esc(c.testo)) +
             '<details class="perche"><summary>Testo del protocollo</summary><p>' + esc(c.testo) + '</p></details></div>';
      });
      if (r.conflitti.length) h += '<div class="motivo">Co-arruolamento: è già in ' + esc(r.conflitti.join(", ")) + '. <button class="tocca" id="cambia-studi">Correggi nel menu</button></div>';
    }
    if (r.esito === K.DAVER) {
      var es = r.esami_da_ripetere.map(function (e) {
        var vs = (SPEC.validita[e] || []).slice(0, 1);
        return '<button class="esame" data-esame="' + esc(vs.join(",")) + '">ripetere ' + esc(e) + '</button>';
      }).concat(r.esami_mancanti.map(function (e) {
        return '<button class="esame" data-esame="' + esc(e[1].join(",")) + '">' + esc(e[0]) + '</button>';
      }));
      if (es.length) h += '<div>Per saperlo serve: ' + es.join(" ") + '</div>';
      if (r.altri_mancanti.length) h += '<div class="lista">Dati non noti:' + r.altri_mancanti.map(function (v) {
        return '<button class="tocca" data-correggi="' + esc(v) + '">' + esc(etichettaVar(v)) + '</button>'; }).join("") + '</div>';
      if (r.manuali_aperti.length) h += '<div class="lista">Lo sperimentatore deve confermare:' + r.manuali_aperti.map(function (c) {
        return '<button class="tocca" data-correggi="' + esc(MOTORE.chiaveVm(r.codice, c.id)) + '">' + esc(c.domanda) + '</button>'; }).join("") + '</div>';
    }
    r.avvisi.forEach(function (a) { h += '<div class="nota">' + esc(a) + '</div>'; });
    h += '</div></article>';
  });
  h += '</div>';
  // salvataggio
  var cod = st.codice || prossimoCodice();
  h += '<div class="card salva-box"><p><b>' + (st.codice ? 'Paziente salvato con il codice <span class="codice">' + esc(st.codice) + '</span>' : 'Salva il paziente su questo telefono') + '</b></p>' +
       '<p class="muted">Usa un numero tuo (es. progressivo sul tuo registro). <b>Non</b> il nosologico né altri dati che lo identificano.</p>' +
       '<form id="fs" class="riga" novalidate><input id="codice" inputmode="numeric" pattern="[0-9]*" maxlength="8" value="' + esc(cod) + '" aria-label="Codice numerico del paziente">' +
       '<button type="submit">' + (st.codice ? 'Aggiorna' : 'Salva') + '</button></form><div class="errore" id="errore-salva"></div></div>';
  var daCompletare = ris.some(function (r) { return r.esito === K.DAVER && MOTORE.prossima(st.dati, [r.codice], st.saltate); });
  h += '<div class="azioni">';
  if (daCompletare) h += '<button class="tutti" id="continua">Continua le domande</button>';
  h += '<button class="sec" id="altro">Menu principale · altro studio</button>' +
       '<button class="sec" id="copia">Copia il riepilogo delle risposte</button>' +
       '<button class="sec" id="nuovo">Nuovo paziente</button></div>';
  h += '<details class="card"><summary><b>Risposte date (' + st.storia.length + ')</b> · tocca per correggere</summary><div class="salvati" style="margin-top:6px">' +
       righeRiepilogo().map(function (x) { return '<button class="voce" data-correggi="' + esc(x[2]) + '"><span>' + esc(x[0]) + '</span><b>' + esc(x[1]) + '</b></button>'; }).join("") + '</div></details>';
  h += '<p class="muted" id="copiato" role="status"></p>' + piede();
  el("app").innerHTML = h;
  collegaMenu();
  document.querySelectorAll("[data-correggi]").forEach(function (b) { b.onclick = function () { correggi(b.getAttribute("data-correggi")); }; });
  document.querySelectorAll("[data-esame]").forEach(function (b) {
    b.onclick = function () {
      var vs = b.getAttribute("data-esame").split(",").filter(function (x) { return x; });
      st.saltate = st.saltate.filter(function (x) { return vs.indexOf(x) < 0; });
      st.coda = vs.filter(function (x) { return MOTORE.vuoto(st.dati[x]); }).slice(0, 3);
      if (!st.coda.length) st.coda = vs.slice(0, 1);
      st.avviso = ""; prossima();
    };
  });
  if (el("cambia-studi")) el("cambia-studi").onclick = function () { st.vista = "inizio"; render(); };
  if (el("continua")) el("continua").onclick = prossima;
  el("altro").onclick = function () { st.vista = "inizio"; render(); };
  el("nuovo").onclick = nuovoPaziente;
  el("copia").onclick = copia;
  el("fs").onsubmit = function (e) {
    e.preventDefault();
    var c = el("codice").value.trim(), err = el("errore-salva");
    if (!/^\d{1,8}$/.test(c)) { err.textContent = "Il codice deve essere solo numerico (fino a 8 cifre)."; return; }
    var a = archivio() || {};
    if (a[c] && c !== st.codice && el("codice").getAttribute("data-sicuro") !== c) {
      el("codice").setAttribute("data-sicuro", c);
      err.textContent = "Il codice " + c + " esiste già: tocca di nuovo Salva per sostituirlo.";
      return;
    }
    var problema = salvaPaziente(c);
    if (problema) { err.textContent = problema; return; }
    st.msg = "Paziente salvato su questo telefono con il codice " + c + ".";
    render();
  };
}

function righeRiepilogo() {
  var out = [];
  st.storia.forEach(function (x) {
    var v = x[0], val = st.dati[v];
    var t = val === undefined ? "non so" : valoreLeggibile(v, val);
    var et = v.indexOf("vm__") === 0 ? "Verifica " + v.split("__")[1] + " " + v.split("__")[2] : etichettaVar(v);
    out.push([et, t, v]);
  });
  return out;
}

function copia() {
  var ris = risultati();
  var testo = "Screening del " + new Date().toLocaleDateString("it-IT") + (st.codice ? " · paziente " + st.codice : "") + "\n" +
    ris.map(function (r) { return r.codice + ": " + VERDETTO[r.esito]; }).join("\n") +
    "\n\n" + righeRiepilogo().map(function (x) { return x[0] + ": " + x[1]; }).join("\n");
  var no = function () { el("copiato").textContent = "Copia non consentita qui: apri “Risposte date” e trascrivi."; };
  try {
    navigator.clipboard.writeText(testo).then(function () { el("copiato").textContent = "Riepilogo copiato (non contiene nomi)."; }, no);
  } catch (e) { no(); }
}

function nuovoPaziente() { st = statoVuoto(); render(); }

function render() {
  if (st.vista === "domanda") vistaDomanda();
  else if (st.vista === "esito") vistaEsito();
  else vistaInizio();
  window.scrollTo(0, 0);
}

// Tasti su computer: S = Sì, N = No, Esc = Non so
document.addEventListener("keydown", function (e) {
  if (st.vista !== "domanda" || !st.dom || e.target.tagName === "INPUT") return;
  if (st.dom.tipo === "sino" && (e.key === "s" || e.key === "S")) rispondi("si");
  else if (st.dom.tipo === "sino" && (e.key === "n" || e.key === "N")) rispondi("no");
  else if (e.key === "Escape") rispondi(null);
});
render();

</script>
</body>
</html>
